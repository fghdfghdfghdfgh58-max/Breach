<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena FPS</title>
<style>
:root{--panel:#fff;--text:#14181f;--mut:#667085;--line:#d0d5dd;--acc:#e8541f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#161b23;--text:#eef1f6;--mut:#8a94a6;--line:#2c3441}}
:root[data-theme="dark"]{--panel:#161b23;--text:#eef1f6;--mut:#8a94a6;--line:#2c3441}
html,body{height:100%;margin:0;background:#0b0e13;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,12,.45);z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,90vw)}
h1{margin:0;letter-spacing:.2em;font-size:28px}.sub{margin:4px 0 18px;color:var(--mut);font-size:14px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;margin-bottom:10px}
#code{text-transform:uppercase;letter-spacing:.2em;text-align:center;margin:0}
button{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;cursor:pointer}
button.pri{width:100%;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{display:flex;gap:8px}.or{text-align:center;color:var(--mut);margin:10px 0;font-size:13px}
#err{color:#e5484d;min-height:18px;margin-top:10px;font-size:14px}.help{color:var(--mut);font-size:12px;margin:8px 0 0;line-height:1.5}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000;z-index:3}

#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;transition:opacity .15s;background:linear-gradient(45deg,transparent 45%,#fff 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45% 55%,transparent 55%)}

#top b{font-size:24px;letter-spacing:.25em}#top small{display:block;opacity:.8;font-size:11px}
#stat{position:absolute;left:18px;bottom:18px;font-size:30px;font-weight:700}

#ammo{position:absolute;right:22px;bottom:18px;font-size:34px;font-weight:700}
#feed{position:absolute;right:14px;top:14px;text-align:right;font-size:14px}#feed div{background:rgba(0,0,0,.5);padding:3px 8px;margin-bottom:3px;border-radius:4px}

#dmg{position:absolute;inset:0;box-shadow:inset 0 0 140px 30px #c00;opacity:0;transition:opacity .25s}
#dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30px;background:rgba(80,0,0,.35)}
#sb{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:12px 18px;border-radius:10px;min-width:300px;display:none}
#sb div{display:flex;justify-content:space-between;gap:24px;padding:2px 0}

[hidden]{display:none!important}
.card{width:min(420px,92vw)}
.prof{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.prof button{padding:6px 12px;font-size:13px}
.lbl{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 6px}

#rooms button{padding:5px 12px;font-size:14px}#rooms .empty{color:var(--mut);justify-content:center}
.chk{display:flex;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mut)}.chk input{width:auto;margin:0 8px 0 0}
</style></head><body>
<div id="menu"><div class="card"><h1>ARENA</h1><p class="sub">Online multiplayer shooter</p>

<div id="lobby" hidden><div class="prof"><div><b id="uname"></b><div id="stats" class="sub" style="margin:2px 0 0"></div></div><button id="logout">Log out</button></div>
<div class="lbl">Public rooms</div><div id="rooms"></div>
<div class="lbl">Create a room</div><input id="rn" maxlength="24" placeholder="Room name (optional)"><label class="chk"><input id="pub" type="checkbox" checked> Public (listed for everyone)</label><button id="create" class="pri">Create room</button>
<div class="or">or join a private room by code</div><div class="row"><input id="code" maxlength="6" placeholder="CODE"><button id="join">Join</button></div></div>
<div id="err"></div><p class="help">WASD move · Shift sprint · Space jump · Click shoot · R reload · Tab scoreboard</p></div></div>
<div id="hud" hidden><div id="dmg"></div><div id="cross"></div><div id="hm"></div>

<div id="hint" hidden><div style="text-align:center">Click to play<br><button id="leave" style="margin-top:14px">Leave room</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),R=.4,r2=v=>Math.round(v*100)/100,r3=v=>Math.round(v*1000)/1000;
const COLS=[0xd9534f,0x4f8fd9,0x5cb85c,0xe8b53a,0xa56ad9,0x3ac9c0,0xe88a3a,0xd96aa7];
const SP=[[-27,-27],[27,27],[-27,27],[27,-27],[0,-28],[0,28],[-28,0],[28,0]];
let room=null,myPeer='',name='',code='',playing=false,locked=false,keys={},mouse=false,lastShot=0,reloadAt=0,sh=0,so=[0,0,0],sd=[0,0,-1],yaw=0,pitch=0,kick=0,flashT=0,pt=0;
const me={x:0,y:0,z:0,vx:0,vz:0,vy:0,hp:100,k:0,d:0,lk:'',c:0,dead:false,ammo:30,ground:true};
const remotes=new Map(),boxes=[],firsts=new Map(),dummy={x:8,z:-22,hp:100,first:0,g:null};
// ---------- renderer / world ----------
const rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;rd.outputEncoding=T.sRGBEncoding;document.body.prepend(rd.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(75,1,.05,220);cam.rotation.order='YXZ';scene.add(cam);
scene.fog=new T.Fog(0xb6c9db,45,150);
{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#5d8fc7');g.addColorStop(1,'#cfdce8');x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new T.CanvasTexture(c)}
scene.add(new T.HemisphereLight(0xcfe3ff,0x444444,.65));
const sun=new T.DirectionalLight(0xfff1d6,.95);sun.position.set(25,45,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:120});sun.shadow.bias=-.0004;scene.add(sun);
function rs(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
function tex(base,line){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);for(let i=0;i<6000;i++){const v=Math.random()*70|0;x.fillStyle=`rgba(${v},${v},${v},.13)`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}x.strokeStyle=line;x.lineWidth=3;x.strokeRect(1,1,254,254);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=4;return t}
const tConc=tex('#9a9da2','rgba(0,0,0,.4)'),tFloor=tex('#74787d','rgba(0,0,0,.3)'),tWood=tex('#a07a4c','rgba(40,25,10,.7)'),tMetal=tex('#d8d8d8','rgba(0,0,0,.55)');
function mat(t,rx,ry,c=0xffffff,m=.05){const k=t.clone();k.needsUpdate=true;k.repeat.set(Math.max(1,Math.round(rx)),Math.max(1,Math.round(ry)));return new T.MeshStandardMaterial({map:k,color:c,roughness:.82,metalness:m})}
function box(x,z,w,d,h,t,y0=0,c=0xffffff,col=true){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(t,Math.max(w,d)/3,h/3,c,t===tMetal?.5:.05));m.position.set(x,y0+h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);if(col)boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,bot:y0,top:y0+h});return m}
function cyl(x,z,r,h,c,col=true,m=.2){const o=new T.Mesh(new T.CylinderGeometry(r,r,h,20),new T.MeshStandardMaterial({color:c,roughness:.6,metalness:m}));o.position.set(x,h/2,z);o.castShadow=o.receiveShadow=true;scene.add(o);if(col)boxes.push({x0:x-r,x1:x+r,z0:z-r,z1:z+r,bot:0,top:h})}
{const f=new T.Mesh(new T.PlaneGeometry(70,70),mat(tFloor,23,23));f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);
 box(0,-32.5,66,1,7,tConc);box(0,32.5,66,1,7,tConc);box(-32.5,0,1,66,7,tConc);box(32.5,0,1,66,7,tConc);
 // central bunker with doorways
 for(const s of[-1,1]){box(-4.5,7*s,5,1,4,tConc);box(4.5,7*s,5,1,4,tConc);box(7*s,-4.5,1,5,4,tConc);box(7*s,4.5,1,5,4,tConc)}
 box(0,0,16,.4,.4,tConc,4,0xffffff,false);
 // crates, low walls
 [[-14,-6],[14,6],[-10,12],[10,-12],[-18,0],[18,0],[0,-18],[0,18],[-16,-14],[16,14]].forEach(([x,z],i)=>{box(x,z,1.8,1.8,1.1,tWood,0,0xffffff);if(i%3==0)box(x+1.9,z+.2,1.5,1.5,1.1,tWood);if(i%4==1)box(x,z,1.5,1.5,1.1,tWood,1.1)});
 [[-6,-16,6,.5],[6,16,6,.5],[-20,8,.5,6],[20,-8,.5,6]].forEach(([x,z,w,d])=>box(x,z,w,d,1.2,tConc));
 // shipping containers
 [[-20,-20,8,2.6,0xb5453f],[20,20,8,2.6,0x3f6fb5],[24,-12,2.6,8,0x6aa24a],[-24,12,2.6,8,0xd09a2a]].forEach(([x,z,w,d,c])=>{box(x,z,w,d,2.6,tMetal,0,c);box(x,z,w+.1,d+.1,.15,tMetal,2.6,0x333333,false)});
 // pillars + barrels + raised platform
 [[-11,-11],[11,11],[-11,11],[11,-11]].forEach(([x,z])=>{cyl(x,z,.6,5,0xb8bbc0);cyl(x,z,.8,.4,0x777b80,false)});
 [[-3,-24],[4,24],[-25,-4],[25,4],[12,-8]].forEach(([x,z])=>{cyl(x,z,.38,1,0xa33a2c,true,.5);cyl(x+.8,z+.2,.38,1,0x2c5aa3,true,.5)});
 box(14,-12.6,3,1.6,.5,tConc);box(14,-18,8,8,1,tConc);box(15,-19,1.6,1.6,1.1,tWood,1);
 [[-28,-28],[28,28],[-28,28],[28,-28]].forEach(([x,z])=>{cyl(x,z,.12,5,0x333,false);const b=new T.Mesh(new T.BoxGeometry(.6,.2,.6),new T.MeshBasicMaterial({color:0xfff2c0}));b.position.set(x,5.1,z);scene.add(b)});
}
// ---------- characters ----------
function mkChar(col){const g=new T.Group(),M=c=>new T.MeshStandardMaterial({color:c,roughness:.75}),cl=M(col),sk=M(0xd9a98a),dk=M(0x23272e);
 const add=(p,geo,m,x,y,z)=>{const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
 add(g,new T.BoxGeometry(.52,.66,.3),cl,0,1.15,0);add(g,new T.SphereGeometry(.21,16,12),sk,0,1.62,0);add(g,new T.SphereGeometry(.23,16,8,0,6.3,0,1.5),dk,0,1.64,0);
 g.legs=[-.13,.13].map(x=>{const p=new T.Group();p.position.set(x,.85,0);add(p,new T.BoxGeometry(.2,.85,.22),dk,0,-.42,0);g.add(p);return p});
 add(g,new T.BoxGeometry(.14,.14,.55),cl,-.3,1.25,-.2);add(g,new T.BoxGeometry(.14,.14,.55),cl,.2,1.3,-.28);add(g,new T.BoxGeometry(.07,.1,.7),dk,.1,1.3,-.5);return g}
function tag(s){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 30px system-ui';x.textAlign='center';x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(s,128,43);const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(1.6,.4,1);sp.position.y=2.15;sp.renderOrder=9;return sp}
dummy.g=mkChar(0x888888);dummy.g.position.set(dummy.x,0,dummy.z);dummy.g.add(tag('Target Dummy'));scene.add(dummy.g);
const gun=new T.Group();[[.06,.1,.5,0,0,0,0x2b2f36],[.035,.035,.3,0,.02,-.38,0x15181c],[.05,.16,.08,0,-.12,.08,0x2b2f36],[.05,.07,.2,0,-.02,.3,0x3a3f48]].forEach(([w,h,d,x,y,z,c])=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.5,metalness:.6}));m.position.set(x,y,z);gun.add(m)});
const flash=new T.Mesh(new T.PlaneGeometry(.2,.2),new T.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:0,depthWrite:false}));flash.position.set(0,.02,-.6);gun.add(flash);gun.position.set(.2,-.2,-.4);cam.add(gun);
// ---------- ray math / collision ----------
function rayBox(o,d,b){let t0=0,t1=1e9;for(const[a,lo,hi]of[[0,b.x0,b.x1],[1,b.bot,b.top],[2,b.z0,b.z1]]){const oa=o[a],da=d[a];if(Math.abs(da)<1e-9){if(oa<lo||oa>hi)return null}else{let u=(lo-oa)/da,v=(hi-oa)/da;if(u>v){const w=u;u=v;v=w}t0=Math.max(t0,u);t1=Math.min(t1,v);if(t0>t1)return null}}return t0}
function rayWorld(o,d){let t=120;for(const b of boxes){const h=rayBox(o,d,b);if(h!==null&&h<t)t=h}if(d[1]<0)t=Math.min(t,-o[1]/d[1]);return t}
function raySphere(o,d,c,r){const x=o[0]-c[0],y=o[1]-c[1],z=o[2]-c[2],b=x*d[0]+y*d[1]+z*d[2],cc=x*x+y*y+z*z-r*r,s=b*b-cc;if(s<0)return null;const t=-b-Math.sqrt(s);return t>0?t:null}
function body(o,d,px,py,pz){let best=null;for(const[cy,r,h]of[[1.62,.25,1],[1.1,.42,0],[.5,.4,0]]){const t=raySphere(o,d,[px,py+cy,pz],r);if(t!==null&&(!best||t<best.t))best={t,head:!!h}}return best}
function resolve(){for(const b of boxes){if(b.top<=me.y+.55||b.bot>=me.y+1.8)continue;const cx=Math.max(b.x0,Math.min(me.x,b.x1)),cz=Math.max(b.z0,Math.min(me.z,b.z1)),ax=me.x-cx,az=me.z-cz,dd=ax*ax+az*az;if(dd<R*R){if(dd>1e-8){const d=Math.sqrt(dd),k=(R-d)/d;me.x+=ax*k;me.z+=az*k}else{const l=me.x-b.x0,r=b.x1-me.x,f=me.z-b.z0,k=b.z1-me.z,m=Math.min(l,r,f,k);if(m===l)me.x=b.x0-R;else if(m===r)me.x=b.x1+R;else if(m===f)me.z=b.z0-R;else me.z=b.z1+R}}}}
// ---------- effects ----------
let ac;function snd(v){try{ac=ac||new AudioContext();const n=ac.sampleRate*.12|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.frequency.value=1800;g.gain.value=Math.min(1,v);s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
function tracer(a,b){const g=new T.BufferGeometry().setFromPoints([a,b]),l=new T.Line(g,new T.LineBasicMaterial({color:0xffe9a8,transparent:true,opacity:.85}));scene.add(l);setTimeout(()=>{scene.remove(l);g.dispose()},60)}
function feed(s){const d=document.createElement('div');d.textContent=s;$('feed').appendChild(d);setTimeout(()=>d.remove(),4500)}
function popTTK(ms){const e=$('ttk');e.textContent='TTK '+(ms/1000).toFixed(2)+'s';e.style.opacity=1;clearTimeout(popTTK.t);popTTK.t=setTimeout(()=>e.style.opacity=0,2200)}
function hitmark(){const e=$('hm');e.style.opacity=1;setTimeout(()=>e.style.opacity=0,110)}
// ---------- multiplayer (room presence) ----------
function pres(){if(!room)return;room.presence({n:name,x:r2(me.x),y:r2(me.y),z:r2(me.z),ry:r2(yaw),hp:me.hp,k:me.k,d:me.d,lk:me.lk,c:me.c,sh:sh,so:so.map(r2),sd:sd.map(r3),mv:r2(Math.hypot(me.vx,me.vz))}).catch(()=>{})}
function num(v,d=0){return Number.isFinite(v)?v:d}
function onPeers(ch){for(const p of ch.left){const r=remotes.get(p.peer);if(r){scene.remove(r.g);remotes.delete(p.peer)}}
 for(const p of ch.peers){if(p.isMe){if(p.sameTab)myPeer=p.peer;continue}const pr=p.presence||{};if(typeof pr.x!=='number')continue;
  let r=remotes.get(p.peer);if(!r){const g=mkChar(COLS[num(pr.c)&7]);g.add(tag(String(pr.n||'Player').slice(0,16)));scene.add(g);r={g,pos:new T.Vector3(num(pr.x),num(pr.y),num(pr.z)),ry:num(pr.ry),sh:num(pr.sh)|0,d:num(pr.d)|0,pr,peer:p.peer,last:new T.Vector3(),};remotes.set(p.peer,r)}
  r.pr=pr;if((num(pr.sh)|0)>r.sh){r.sh=num(pr.sh)|0;rShot(r)}
  if((num(pr.d)|0)>r.d){r.d=num(pr.d)|0;rKill(r)}}
 $('cnt').textContent=ch.peers.length+(ch.peers.length===1?' player':' players')+' in room'}
function rShot(r){const pr=r.pr;if(num(pr.hp)<=0||!Array.isArray(pr.so)||!Array.isArray(pr.sd))return;const o=pr.so.map(v=>num(v)),d=pr.sd.map(v=>num(v)),l=Math.hypot(...d)||1;d[0]/=l;d[1]/=l;d[2]/=l;
 const wt=rayWorld(o,d),dist=Math.hypot(o[0]-me.x,o[2]-me.z);let end=wt;
 let h=null;if(!me.dead&&playing)h=body(o,d,me.x,me.y,me.z);if(h&&h.t<wt){end=h.t;me.hp-=h.head?45:25;$('dmg').style.opacity=1;setTimeout(()=>$('dmg').style.opacity=0,250);if(me.hp<=0)die(r.peer);else pres()}
 tracer(new T.Vector3(o[0],o[1]-.3,o[2]),new T.Vector3(o[0]+d[0]*end,o[1]+d[1]*end,o[2]+d[2]*end));snd(8/(8+dist)*.5)}
function rKill(r){const killer=r.pr.lk===myPeer?'You':(remotes.get(r.pr.lk)?.pr.n||'Someone');feed(killer+' ▸ '+String(r.pr.n||'Player').slice(0,16));
 if(r.pr.lk===myPeer){me.k++;const f=firsts.get(r.peer);if(f)popTTK(performance.now()-f.t0);firsts.delete(r.peer);pres()}}
function die(by){me.dead=true;me.hp=0;me.d++;me.lk=by||'';feed((remotes.get(by)?.pr.n||'Someone')+' ▸ You');$('dead').style.display='flex';pres();setTimeout(respawn,3000)}
function respawn(){const s=SP[Math.random()*SP.length|0];Object.assign(me,{x:s[0],z:s[1],y:0,vx:0,vz:0,vy:0,hp:100,ammo:30,dead:false});yaw=Math.atan2(s[0],s[1]);pitch=0;reloadAt=0;$('dead').style.display='none';pres()}
// ---------- shooting ----------
function fwd(){return{x:-Math.sin(yaw)*Math.cos(pitch),y:Math.sin(pitch),z:-Math.cos(yaw)*Math.cos(pitch)}}
function shoot(now){lastShot=now;me.ammo--;const sp=.005+Math.hypot(me.vx,me.vz)*.001+(me.ground?0:.02),f=fwd(),rn=()=>(Math.random()-.5)*sp*2,d=new T.Vector3(f.x+rn(),f.y+rn(),f.z+rn()).normalize(),o=[me.x,me.y+1.65,me.z],da=[d.x,d.y,d.z],wt=rayWorld(o,da);
 let best=null,tg=null;const test=(px,py,pz,t)=>{const h=body(o,da,px,py,pz);if(h&&h.t<wt&&(!best||h.t<best.t)){best=h;tg=t}};
 for(const r of remotes.values())if(num(r.pr.hp)>0)test(r.pos.x,r.pos.y,r.pos.z,r);if(dummy.hp>0)test(dummy.x,0,dummy.z,dummy);
 if(best){hitmark();const now2=performance.now();if(tg===dummy){if(!dummy.first||now2-dummy.last>4000)dummy.first=now2;dummy.last=now2;dummy.hp-=best.head?45:25;if(dummy.hp<=0){popTTK(now2-dummy.first);dummy.first=0;dummy.g.visible=false;setTimeout(()=>{dummy.hp=100;dummy.g.visible=true},1500)}}
  else{let f2=firsts.get(tg.peer);if(!f2||now2-f2.last>4000)f2={t0:now2};f2.last=now2;firsts.set(tg.peer,f2)}}
 cam.updateMatrixWorld(true);const mz=gun.localToWorld(new T.Vector3(0,.02,-.55)),e=best?best.t:wt;tracer(mz,new T.Vector3(o[0]+da[0]*e,o[1]+da[1]*e,o[2]+da[2]*e));
 pitch+=.004+Math.random()*.003;yaw+=(Math.random()-.5)*.004;kick=.06;flashT=.04;snd(.45);so=o;sd=da;sh++;pres()}
// ---------- input ----------
addEventListener('keydown',e=>{if(!playing)return;keys[e.code]=true;if(['Space','Tab'].includes(e.code))e.preventDefault();if(e.code==='Tab')$('sb').style.display='block',board();if(e.code==='KeyR'&&me.ammo<30&&!reloadAt)reloadAt=performance.now()+1700});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Tab')$('sb').style.display='none'});
addEventListener('mousedown',e=>{if(e.button===0)mouse=true});addEventListener('mouseup',e=>{if(e.button===0)mouse=false});
addEventListener('mousemove',e=>{if(!locked||!playing||me.dead)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===rd.domElement;$('hint').hidden=locked||!playing});
document.addEventListener('pointerlockerror',()=>{locked=true;$('hint').hidden=true});
$('hint').onclick=()=>{try{rd.domElement.requestPointerLock()}catch(e){locked=true;$('hint').hidden=true}};
$('top').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}};
function board(){const l=[{n:name+' (you)',k:me.k,d:me.d,c:me.c}];for(const r of remotes.values())l.push({n:String(r.pr.n||'Player').slice(0,16),k:num(r.pr.k),d:num(r.pr.d),c:num(r.pr.c)});l.sort((a,b)=>b.k-a.k);const sb=$('sb');sb.textContent='';for(const p of l){const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');a.textContent=p.n;a.style.color='#'+COLS[p.c&7].toString(16).padStart(6,'0');b.textContent=p.k+' K / '+p.d+' D';d.append(a,b);sb.appendChild(d)}}

// ---------- WebSocket networking (replaces the Claude room) ----------
function netJoin(opts){return new Promise((res,rej)=>{
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),peers=new Map();let myId='',hs=[],pend=null,gone=[],ok=false;
 const mkp=(id,pr)=>({peer:id,isMe:id===myId,sameTab:id===myId,presence:pr||{}});
 const flush=()=>{pend=null;const arr=[...peers.values()],l=gone;gone=[];hs.forEach(h=>h({peers:arr,joined:[],left:l,updated:[]}))};
 const sched=()=>{if(!pend)pend=setTimeout(flush,16)};
 const api={presence(p){const m=peers.get(myId);if(m)Object.assign(m.presence,p);if(ws.readyState===1)ws.send(JSON.stringify({t:'p',pr:p}));return Promise.resolve()},onPeers(h){hs.push(h);sched();return()=>{}}};
 ws.onopen=()=>ws.send(JSON.stringify(Object.assign({t:'join',token:tok},opts)));
 ws.onerror=()=>{if(!ok)rej(new Error('Could not reach the game server.'))};
 ws.onclose=()=>{if(ok)feed('Disconnected from server')};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==='err')rej(new Error(m.msg));
  else if(m.t==='hello'){myId=m.id;ok=true;peers.set(myId,mkp(myId,{}));for(const[id,pr]of Object.entries(m.peers))peers.set(id,mkp(id,pr));api.code=m.code;api.rname=m.rname;api.pub=m.pub;res(api);sched()}
  else if(m.t==='p'){const p=peers.get(m.id);if(p)Object.assign(p.presence,m.pr);else peers.set(m.id,mkp(m.id,m.pr));sched()}
  else if(m.t==='l'){const p=peers.get(m.id);if(p){gone.push(p);peers.delete(m.id)}sched()}}})}
// ---------- accounts + lobby ----------
let tok='',user=null,poll=0;try{tok=localStorage.getItem('tok')||''}catch(e){}
function err(m){$('err').textContent=m||''}
async function api(path,b){const r=await fetch(path,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Request failed');return j}
function show(id){$('auth').hidden=id!=='auth';$('lobby').hidden=id!=='lobby';err('')}
function setUser(u){user=u;$('uname').textContent=u.name;$('stats').textContent=u.kills+' kills · '+u.deaths+' deaths · K/D '+(u.deaths?(u.kills/u.deaths).toFixed(2):u.kills)+' · '+u.games+' games'}
async function authDo(kind){try{const j=await api('/api/'+kind,{username:$('au').value.trim(),password:$('ap').value});tok=j.token;try{localStorage.setItem('tok',tok)}catch(e){}setUser(j.user);lobby()}catch(e){err(e.message)}}
$('login').onclick=()=>authDo('login');$('register').onclick=()=>authDo('register');
$('logout').onclick=async()=>{try{await api('/api/logout',{})}catch(e){}tok='';try{localStorage.removeItem('tok')}catch(e){}clearInterval(poll);show('auth')};
function lobby(){show('lobby');refresh();clearInterval(poll);poll=setInterval(refresh,3000)}
async function refresh(){try{const j=await api('/api/rooms'),l=$('rooms');l.textContent='';if(!j.rooms.length){const d=document.createElement('div');d.className='empty';d.textContent='No public rooms yet. Create one!';l.appendChild(d)}
 for(const r of j.rooms){const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('button');a.textContent=r.name+' · '+r.players+'/16';b.textContent='Join';b.onclick=()=>enter({code:r.code});d.append(a,b);l.appendChild(d)}}catch(e){}}
$('create').onclick=()=>enter({create:true,pub:$('pub').checked,rname:$('rn').value});
$('join').onclick=()=>enter({code:$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
$('leave').onclick=e=>{e.stopPropagation();location.reload()};
async function enter(opts){err('Connecting…');
 try{room=await netJoin(opts);room.onPeers(onPeers)}catch(e){return err(e.message||'Could not connect.')}
 clearInterval(poll);code=room.code;name=user.name;
 $('rl').textContent=room.pub?'PUBLIC ROOM':'PRIVATE ROOM · share this code';$('rc').textContent=room.pub?room.rname:code;$('rc').style.letterSpacing=room.pub?'0':'.25em';
 me.c=Math.random()*8|0;respawn();$('menu').hidden=true;$('hud').hidden=false;playing=true;$('hint').hidden=false;pres()}
(async()=>{if(tok){try{const j=await api('/api/me');setUser(j.user);return lobby()}catch(e){}}show('auth')})();
// ---------- main loop ----------
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!playing){const t=now/1000*.1;cam.position.set(Math.cos(t)*26,9,Math.sin(t)*26);cam.lookAt(0,1.5,0);rd.render(scene,cam);return}
 if(locked&&!me.dead){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=(keys.ShiftLeft?8.5:6)*(reloadAt?.8:1);let wx=0,wz=0;if(f||s){const l=Math.hypot(f,s);wx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/l;wz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/l}
  const k=Math.min(1,dt*10);me.vx+=(wx*sp-me.vx)*k;me.vz+=(wz*sp-me.vz)*k;me.x+=me.vx*dt;resolve();me.z+=me.vz*dt;resolve();
  if(reloadAt&&now>=reloadAt){me.ammo=30;reloadAt=0}if(me.ammo<=0&&!reloadAt)reloadAt=now+1700;
  if(mouse&&!reloadAt&&me.ammo>0&&now-lastShot>100)shoot(now)}
 let gy=0;for(const b of boxes)if(b.top<=me.y+.55&&me.x>b.x0-.3&&me.x<b.x1+.3&&me.z>b.z0-.3&&me.z<b.z1+.3&&b.top>gy)gy=b.top;
 me.vy-=22*dt;me.y+=me.vy*dt;me.ground=false;if(me.y<=gy){me.y=gy;me.vy=0;me.ground=true}
 if(keys.Space&&me.ground&&locked&&!me.dead)me.vy=7.2;
 if(now-pt>66){pt=now;pres()}
 kick*=Math.pow(.001,dt);flashT-=dt;flash.material.opacity=flashT>0?1:0;gun.position.set(.2,-.2-kick*.3,-.4+kick);gun.rotation.x=kick*2;
 cam.position.set(me.x,me.y+(me.dead?.5:1.65),me.z);cam.rotation.set(pitch,yaw,me.dead?.8:0);
 for(const r of remotes.values()){const pr=r.pr,tx=num(pr.x),ty=num(pr.y),tz=num(pr.z),k=1-Math.exp(-12*dt);r.last.copy(r.pos);r.pos.x+=(tx-r.pos.x)*k;r.pos.y+=(ty-r.pos.y)*k;r.pos.z+=(tz-r.pos.z)*k;
  let da=num(pr.ry)-r.ry;da=Math.atan2(Math.sin(da),Math.cos(da));r.ry+=da*k;r.g.position.copy(r.pos);r.g.rotation.y=r.ry;r.g.visible=num(pr.hp)>0;
  const sw=Math.sin(now/110)*Math.min(.9,Math.hypot(r.pos.x-r.last.x,r.pos.z-r.last.z)/dt*.12);r.g.legs[0].rotation.x=sw;r.g.legs[1].rotation.x=-sw}
 $('hp').textContent=Math.max(0,me.hp);$('bar').firstChild.style.width=Math.max(0,me.hp)+'%';$('bar').firstChild.style.background=me.hp>50?'#4cd964':me.hp>25?'#ffcc00':'#ff3b30';
 $('ammo').textContent=reloadAt?'Reloading…':me.ammo+' / ∞';
 if($('sb').style.display==='block')board();
 rd.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
